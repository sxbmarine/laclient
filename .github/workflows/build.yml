name: Build Multi-Platform (Windows & macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron Binaries
        env:
          VITE_SUPABASE_URL: https://pwgicqmwroutwnitkalo.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3Z2ljcW13cm91dHduaXRrYWxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODc5MDAsImV4cCI6MjEwMDQ2MzkwMH0.Qm482IkucVKdXxPv19Vds2tTcZnxqOnY3XxTfxN_BvY
        run: npm run build:vite && npx electron-builder --publish never

      - name: Upload Single Unified Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
